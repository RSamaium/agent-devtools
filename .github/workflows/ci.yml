name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:packages
      - run: pnpm --filter './packages/**' build
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' build
      - run: pnpm test:examples
      - run: pnpm --filter './examples/*' build
      - run: pnpm --filter @adp-devtools/browser exec playwright-core install --with-deps chromium firefox webkit
      - run: |
          pnpm --filter basic-app exec ng serve --host 127.0.0.1 --port 4200 > /tmp/ng-agent-basic-app.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200 >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "${ready:-false}" = true || { cat /tmp/ng-agent-basic-app.log; exit 1; }
          pnpm test:browsers
      - run: |
          pnpm --filter pixi-app exec vite --host 127.0.0.1 --port 5173 > /tmp/agent-devtools-pixi-app.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173 >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "${ready:-false}" = true || { cat /tmp/agent-devtools-pixi-app.log; exit 1; }
          pnpm test:browsers:pixi
