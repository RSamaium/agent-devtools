name: CI
on:
  push:
  pull_request:
jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ matrix.node }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:packages
      - run: pnpm --filter './packages/**' build
  angular-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' build
      - run: pnpm test:examples
      - run: pnpm --filter './examples/*' build
      - run: pnpm --filter @ng-agent/browser exec playwright-core install --with-deps chromium firefox webkit
      - run: |
          pnpm --filter basic-app exec ng serve --host 127.0.0.1 --port 4200 > /tmp/ng-agent-basic-app.log 2>&1 &
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:4200 >/dev/null && break; sleep 1; done
          pnpm test:browsers
