<main>
  <h1>{{ title() }}</h1>
  <p>This development application exercises component, Router, Signal and Signal Forms inspection.</p>

  <form (submit)="$event.preventDefault(); submit()">
    <label>
      Email
      <input type="email" [formField]="accountForm.email" />
    </label>
    <label>
      Password
      <input type="password" [formField]="accountForm.password" />
    </label>
    <button type="submit">Submit</button>
  </form>
  <router-outlet />
</main>
